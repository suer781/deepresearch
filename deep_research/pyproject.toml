[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research"
version = "0.1.0"
description = "Super-parallel multi-agent deep research system with adversarial debate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LLM
    "openai>=1.50.0",
    "anthropic>=0.30.0",
    # Web 抓取
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    # 搜索 API
    "tavily-python>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.0",
    "huggingface-hub>=0.24.0",
    # 数据 & 存储
    "pydantic>=2.7.0",
    "networkx>=3.3",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # 并发 & 异步
    "asyncio-throttle>=1.0.2",
    "tenacity>=8.3.0",
    # CLI & 配置
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
